apiVersion: apps/v1
kind: Deployment
metadata: {name: expense-tracker-broken-image, namespace: expense-tracker}
spec:
  replicas: 1
  selector: {matchLabels: {app: broken-image}}
  template:
    metadata: {labels: {app: broken-image}}
    spec:
      containers: [{name: backend, image: ghcr.io/example/expense-tracker-backend:does-not-exist}]
