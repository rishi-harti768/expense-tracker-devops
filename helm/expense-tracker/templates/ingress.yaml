{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: {{ include "expense-tracker.fullname" . }}}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - {path: /api, pathType: Prefix, backend: {service: {name: {{ include "expense-tracker.fullname" . }}-backend, port: {number: 8000}}}}
      - {path: /, pathType: Prefix, backend: {service: {name: {{ include "expense-tracker.fullname" . }}-frontend, port: {number: 80}}}}
{{- end }}
