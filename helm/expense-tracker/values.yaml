frontend:
  image: ghcr.io/YOUR_ORG/expense-tracker-frontend
  tag: latest
backend:
  image: ghcr.io/YOUR_ORG/expense-tracker-backend
  tag: latest
replicaCount: 2
namespace: expense-tracker
imagePullSecrets: []
postgres:
  host: expense-tracker-postgres
  database: expense_tracker
  username: expense_tracker
  password: expense_tracker
ingress:
  enabled: false
  className: nginx
  host: expense-tracker.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
monitoring:
  serviceMonitor:
    enabled: true
